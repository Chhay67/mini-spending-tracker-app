name: mini_spend_tracker_app
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.9
  go_router: ^17.2.2
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  dropdown_button2: ^3.0.0
  intl: ^0.20.2
  month_picker_dialog: ^6.7.2
  dio: ^5.9.2
  pretty_dio_logger: ^1.4.0
  shimmer: ^3.0.0
  equatable: ^2.0.8
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/fonts/inter/
    - assets/fonts/work_sans/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter_18pt-Bold.ttf
          weight: 700
    - family: WorkSans
      fonts:
        - asset: assets/fonts/work_sans/WorkSans-SemiBold.ttf
          weight: 600
